# Plain-HTTP API ingress for testnet hosts without a domain or certificate (setup-supervision.sh
# with PROBABL_NGINX=http); the routing and limits match nginx.conf. Production uses nginx.conf.
# Do not trust client-supplied forwarded IP headers.
map $http_upgrade $probabl_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=probabl_requests:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=probabl_connections:10m;
# Do not log query strings, Authorization headers, or request/response bodies.
log_format probabl '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/probabl-access.log probabl;
    error_log /var/log/nginx/probabl-error.log warn;
    client_max_body_size 5m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_req zone=probabl_requests burst=60 nodelay;
    limit_req_status 429;
    limit_conn probabl_connections 50;
    limit_conn_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    proxy_next_upstream off;

    location ~ /\. { return 404; }
    location ^~ /internal/ { return 404; }
    location = /metrics { return 404; }
    location = /sql { return 404; }
    location = /graphql { return 404; }

    # The API process serves the chain index projections (read-only) and /v1 on one port.
    location ~ ^/(markets(?:/[^/]+)?|orderbooks?(?:/[^/]+)?|orders|trades|balances/[^/]+|positions/[^/]+|payouts/[^/]+|resolutions/[^/]+|reconciliation)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000;
    }

    # Server-sent events: index invalidations, wallet images, prices and probabilities.
    location ~ ^/(stream|v1/spot-prices/stream|v1/probabilities/[^/]+/stream)$ {
        limit_except GET { deny all; }
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /v1/polymarket/conditions/ {
        limit_except GET { deny all; }
        # A location declaring any proxy_set_header does not inherit the parent
        # header list, so include the forwarding headers explicitly here too.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $probabl_connection_upgrade;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:42073;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
