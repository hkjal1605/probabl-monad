name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans every pushed commit, which needs their history.
          fetch-depth: 0

      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # Integration tests start their own PostgreSQL cluster (initdb/pg_ctl) and anvil node.
      - name: Put PostgreSQL binaries on PATH
        run: ls -d /usr/lib/postgresql/*/bin | tail -1 >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check Solidity formatting and lint
        run: forge fmt --root contracts --check && forge lint --root contracts

      - name: Build contracts and check bytecode sizes
        run: forge build --root contracts --sizes --skip test

      - name: Ensure the generated ABI is committed
        run: bun run abi && git diff --exit-code -- packages/evm-client/src/abi.ts

      - name: Check TypeScript formatting, lint, and types
        run: bunx biome ci . && bun run typecheck

      - name: Run Solidity tests
        run: bun run test:contracts

      - name: Run TypeScript tests
        run: bun run test:ts

      - name: Audit JavaScript dependencies
        run: bun run audit:deps
